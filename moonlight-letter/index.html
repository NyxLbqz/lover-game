<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1024" />
<title>月光失物局｜给白栖昼的一场夜航</title>
<style>
:root{--night:#080d20;--ink:#edf1ff;--sub:#aab8d6;--gold:#f7dba4;--blue:#8de4f5;--panel:rgba(17,25,53,.80);--line:rgba(198,219,248,.18);--pink:#f2b7ba;--green:#9be7dc}
*{box-sizing:border-box}html{height:100%;background:#080c1e}body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse 70% 48% at 50% 0%,#253254 0%,transparent 83%),linear-gradient(#0b132e,#070a19);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
#app{max-width:1020px;margin:auto;min-height:100svh;padding:clamp(12px,2.6vw,27px);position:relative}
.shell{max-width:780px;margin:0 auto;position:relative}.upper{height:49px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mark{display:flex;align-items:center;gap:10px;color:#dbe7fd;font-size:12px;font-weight:600;letter-spacing:3px}.mark-emblem{border:1px solid #a4b4db5e;border-radius:50%;height:30px;width:30px;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;letter-spacing:0;font-size:15px;background:#ffffff0a}
.right-tools{display:flex;align-items:center;gap:11px}.chapter-small{font-size:10px;color:#9babc9;letter-spacing:1.5px;white-space:nowrap}.sound-btn{border:1px solid var(--line);background:#ffffff0d;color:#e8eafd;padding:7px 11px;border-radius:20px;font-size:11px;min-height:32px}
.headline{margin:12px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:15px}.eyebrow{font-size:10px;letter-spacing:3.5px;color:var(--gold);font-weight:650;margin:0 0 8px}.headline h1{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:500;font-size:clamp(27px,5vw,40px);letter-spacing:4px;margin:0;line-height:1.18;text-shadow:0 2px 26px #8db8eb2b}.headline .smallnum{font-family:Georgia,serif;color:#bdcbe1;opacity:.55;font-size:43px;line-height:1}
.world{position:relative;width:100%;height:clamp(340px,57vw,490px);border:1px solid rgba(169,203,242,.35);border-radius:23px;overflow:hidden;background:#142347;box-shadow:0 16px 70px #030610b3,0 0 0 5px #ffffff05;isolation:isolate}.world:after{content:"";pointer-events:none;position:absolute;inset:0;border-radius:23px;box-shadow:inset 0 0 0 10px #0f1c3222,inset 0 0 80px #040a2a88;z-index:7}
.sky-art{height:100%;width:100%;position:absolute;inset:0;display:block}.world[data-scene="1"] .sky-art{filter:brightness(.88) hue-rotate(6deg)}.world[data-scene="2"] .sky-art{filter:hue-rotate(11deg) saturate(1.1)}.world[data-scene="3"] .sky-art{filter:hue-rotate(-12deg) brightness(.8)}.world[data-scene="4"]{height:600px}.world[data-scene="4"] .sky-art{filter:saturate(.8) brightness(.56)}
.moon-hit{position:absolute;left:62%;top:9%;width:17%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;z-index:5;cursor:pointer}.moon-hit:active{transform:scale(.95)}
.art-overlay{position:absolute;inset:0;z-index:4;pointer-events:none}.art-overlay>*{pointer-events:auto}
.float-tag{position:absolute;left:8%;top:17%;font-size:10px;color:#f7e6bb;letter-spacing:3px;border:1px solid #e2c99564;background:#101b34a6;border-radius:99px;padding:9px 13px;transform:rotate(-7deg);box-shadow:0 4px 25px #05092075}.float-quote{position:absolute;top:31%;left:9%;font-family:"Songti SC",serif;font-size:clamp(17px,3.2vw,27px);letter-spacing:4px;line-height:1.8;color:#eff8ff;text-shadow:0 2px 22px #101c37}.float-quote small{font-size:11px;letter-spacing:2px;display:block;color:#b9cce5;font-family:sans-serif;margin-top:4px}
.light-speck{position:absolute;width:6px;height:6px;background:#fff7d6;border-radius:50%;box-shadow:0 0 12px 4px #f3df9c80;animation:drift 7s infinite alternate ease-in-out;pointer-events:none;z-index:3}
@keyframes drift{0%{transform:translateY(0) scale(.7);opacity:.3}50%{opacity:1}100%{transform:translate(15px,-28px) scale(1.2);opacity:.2}}
.deck{border-radius:21px;margin-top:14px;background:linear-gradient(135deg,#1a2542e8,#101a34ed);border:1px solid #a4b6dc39;padding:clamp(16px,3.4vw,25px);box-shadow:0 10px 38px #0309147c;position:relative;overflow:hidden}.deck:before{content:"✧";position:absolute;font-size:112px;color:#ffffff09;right:12px;top:-45px;pointer-events:none}.deck-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}.deck-kicker{color:#e5c994;font-size:11px;letter-spacing:1.8px}.deck-progress{font-size:11px;letter-spacing:1px;color:#8392af}.deck h2{font-size:clamp(17px,3vw,23px);font-family:"Songti SC",serif;letter-spacing:2px;font-weight:600;margin:0 0 8px}.deck p{color:#bfcae0;font-size:13px;line-height:1.85;max-width:620px;margin:0 0 15px}.btn{border:1px solid #ebdebbaf;color:#16253c;background:linear-gradient(140deg,#fbeac8,#e5c99f);font-size:13px;font-weight:700;letter-spacing:2px;padding:12px 20px;min-height:45px;border-radius:13px;box-shadow:0 6px 25px #f1d09c24;transition:transform .2s,filter .2s}.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn:active{transform:scale(.98)}.btn.secondary{background:#ffffff09;color:#e2eafd;border:1px solid #ffffff38;box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.hint{font-size:11px;color:#94a5c6}.small-footer{text-align:center;font-size:10px;color:#7889ac;letter-spacing:1px;padding:16px 0 7px}.small-footer span{color:#baa6ad}
/* Act I: wipe off the condensation */
.fog-card{position:absolute;left:15%;top:15%;width:70%;height:67%;border:1px solid #ffffff73;border-radius:17px;overflow:hidden;box-shadow:0 20px 80px #000c,0 0 36px #d7e7fc28;background:linear-gradient(132deg,#fce9c9,#d3e3ed 52%,#a5cde2);display:grid;place-items:center}.fog-under{width:100%;height:100%;position:absolute;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:15px;text-align:center;color:#243b53;background:radial-gradient(circle at 50% 20%,#fffaf1 0%,#dae5e5 58%,#bfd5dd 100%)}.fog-under .note-fox{font-size:40px;color:#d89772;font-family:Georgia,serif;line-height:1.1}.fog-under h3{font-family:"Songti SC",serif;margin:7px 0 8px;font-size:clamp(17px,3.4vw,26px);font-weight:700;letter-spacing:2px}.fog-under p{margin:0;color:#536b7b;font-size:clamp(10px,2vw,13px);line-height:1.8}#scratch{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:crosshair;transition:opacity 1s}.fog-done #scratch{opacity:0;pointer-events:none}.wipe-tag{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1d2e4cc9;padding:8px 14px;border-radius:99px;border:1px solid #e5f1f25e;font-size:11px;letter-spacing:2px;color:white;pointer-events:none;transition:opacity .35s}.fog-done .wipe-tag{opacity:0}
/* Act II: tune the radio */
.tune-stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}.orbits{width:min(58%,280px);aspect-ratio:1;position:relative;border-radius:50%;border:1px solid #d8f4ff56;box-shadow:0 0 35px #83cdef2e,inset 0 0 35px #83cdef1a;background:radial-gradient(circle,#5ab9ce47 0%,#17325a85 36%,#0b234643 72%,transparent 74%);transition:transform .6s}.orbits:before{content:"";position:absolute;inset:10%;border-radius:50%;border:1px dashed #b5e3fa80;animation:spin 28s linear infinite}.orbits:after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px solid #e6dbb570}.tune-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff7de,#d8eaf0 28%,#7ca7c5 82%);box-shadow:0 0 45px #bdeafb91,0 0 100px #ccdefb38;display:grid;place-items:center;color:#37587c;font-family:Georgia,serif;font-size:30px}.needle{position:absolute;left:50%;top:50%;width:42%;height:2px;transform-origin:left center;transform:rotate(var(--needle-angle,-130deg));background:linear-gradient(90deg,#fff5cf,#b1f3fc00);box-shadow:0 0 12px #f9dd92;transition:transform .13s}.needle:after{content:"✦";position:absolute;right:-5px;top:-11px;color:#fff4c9;font-size:18px}.station{position:absolute;border-radius:50%;width:17px;height:17px;background:#ffeabd;box-shadow:0 0 15px #ffe6a4,0 0 30px #e4d5aa8a;border:2px solid white;animation:pulse 2.5s infinite alternate}.station.s1{left:8%;top:20%}.station.s2{right:-5%;top:41%}.station.s3{left:27%;bottom:0}.station-label{position:absolute;font-size:11px;letter-spacing:2px;color:#e4edf8;background:#101c36ad;border-radius:20px;padding:7px 12px}.station-label.l1{left:10%;top:17%}.station-label.l2{right:9%;top:36%}.station-label.l3{left:37%;bottom:12%}@keyframes pulse{from{opacity:.45;transform:scale(.8)}to{opacity:1;transform:scale(1.16)}}@keyframes spin{to{transform:rotate(360deg)}}.tuner-control{display:flex;align-items:center;gap:14px;margin:13px 0 17px}.tuner-control label{font-size:11px;letter-spacing:2px;color:#bac7df;white-space:nowrap}.tuner-control input{width:100%;appearance:none;height:5px;background:linear-gradient(90deg,#517c9a,#b8e3e4 50%,#deb9aa);border-radius:99px;outline:0}.tuner-control input::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:#f8e8c7;border:3px solid #7ebcce;box-shadow:0 0 0 5px #bcefff22;cursor:pointer}.signal-status{font-size:11px;color:#d4dfef;background:#ffffff0c;border-radius:99px;padding:8px 11px;display:inline-block;margin-bottom:11px}.signal-status.lock{color:#b3f4e2;background:#58c9b719}
/* Act III: deliver the letter */
.ship-note{position:absolute;left:16%;top:64%;width:90px;height:66px;border:0;padding:0;background:transparent;touch-action:none;cursor:grab;filter:drop-shadow(0 12px 20px #0209198c);z-index:6;transform:translate(-50%,-50%);user-select:none;-webkit-user-select:none}.ship-note:active{cursor:grabbing}.ship-note svg{width:100%;height:100%;overflow:visible}.ship-note.float{animation:bob 2s ease-in-out infinite}@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-9px}}.target-mail{position:absolute;left:76%;top:48%;width:95px;height:95px;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed #f5e7b7a8;box-shadow:0 0 40px #ffe7a74a,inset 0 0 35px #f4d9a71d;display:grid;place-items:center;color:#ffe8b6;font-size:12px;letter-spacing:1px;text-align:center;pointer-events:none;animation:targetGlow 2.5s infinite alternate}.target-mail span{font-size:40px;font-family:Georgia,serif;line-height:1.1}@keyframes targetGlow{to{box-shadow:0 0 75px #ffe7a782,inset 0 0 35px #f4d9a735}}.ship-trail{position:absolute;inset:0;pointer-events:none;opacity:.85}.act3-hint{position:absolute;top:13%;left:8%;border-radius:99px;padding:9px 13px;background:#112547ae;border:1px solid #c7dfef57;font-size:12px;color:#dfeaf4;letter-spacing:2px}
/* Ending: letter */
.end-sheet{position:absolute;left:11%;top:11%;width:78%;min-height:69%;background:linear-gradient(145deg,#fff9ec,#eee1cc);box-shadow:0 18px 60px #020b207c,0 0 70px #f7e7bb5e;border-radius:4px 18px 6px 15px;transform:rotate(-2deg);padding:clamp(16px,3vw,30px);color:#344455;display:flex;flex-direction:column;justify-content:center;animation:appear .95s ease both}.end-sheet:before{content:"";position:absolute;inset:7px;border:1px solid #c8b99776;pointer-events:none;border-radius:2px 13px 4px 9px}.end-sheet .tiny{font-size:10px;color:#a07e6c;letter-spacing:2.5px}.end-sheet h3{font-family:"Songti SC",serif;font-size:clamp(19px,3vw,26px);letter-spacing:2px;font-weight:700;line-height:1.5;margin:14px 0 10px}.end-sheet p{font-family:"Songti SC",serif;font-size:clamp(12px,2vw,15px);letter-spacing:.3px;line-height:1.95;margin:0 0 6px;max-width:540px}.end-sheet .signature{color:#a26e77;text-align:right;margin-top:8px;font-size:15px;font-family:"Songti SC",serif}.secret-note{background:#ede0cbb8;border-left:2px solid #b7837a;margin-top:9px;padding:9px 10px;font-size:11px;line-height:1.7;color:#805e5f}@keyframes appear{from{opacity:0;transform:translateY(24px) rotate(4deg) scale(.92)}to{opacity:1;transform:translateY(0) rotate(-2deg) scale(1)}}
.toast{position:fixed;left:50%;top:max(28px,env(safe-area-inset-top));transform:translate(-50%,-15px);opacity:0;background:#eff5f0;color:#243f50;box-shadow:0 14px 55px #0008;padding:12px 16px;border-radius:13px;z-index:20;pointer-events:none;font-size:12px;text-align:center;max-width:85vw;line-height:1.6;transition:transform .3s,opacity .3s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.world[data-scene="4"]{height:575px;min-height:575px}.moon-hit{left:76%;top:11%;width:19%}#app{padding:12px 12px 8px}.upper{height:38px;margin-bottom:8px}.mark{font-size:10px;letter-spacing:1.9px}.headline{margin:13px 2px}.headline h1{font-size:30px}.headline .smallnum{font-size:29px}.world{height:min(53svh,440px);min-height:325px;border-radius:17px}.deck{margin-top:11px;border-radius:17px;padding:17px}.float-quote{top:32%;left:8%;font-size:18px}.fog-card{width:83%;left:8.5%;height:61%;top:19%}.station-label{font-size:9px;letter-spacing:0.8px;padding:5px 7px}.station-label.l1{left:4%;top:17%}.station-label.l2{right:3%;top:36%}.station-label.l3{left:34%;bottom:9%}.orbits{width:65%}.end-sheet{width:84%;left:8%;top:9%;min-height:77%;padding:23px 20px}.end-sheet p{font-size:13px}.ship-note{width:78px}.deck p{font-size:12px}.deck .btn{font-size:12px}}
@media(prefers-reduced-motion:reduce){.light-speck,.orbits:before,.station,.ship-note.float,.target-mail{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="shell">
  <header class="upper">
   <div class="mark"><span class="mark-emblem">L·B</span><span>月 光 失 物 局</span></div>
   <div class="right-tools"><span class="chapter-small" id="chapter">NO. 000 / PRIVATE</span><button class="sound-btn" id="soundBtn" aria-label="切换声音">♫ 声音开</button></div>
  </header>
  <div class="headline"><div><p class="eyebrow" id="eyebrow">AN AFTER-HOURS ADVENTURE</p><h1 id="heroTitle">给白的一场夜航</h1></div><span class="smallnum" id="chapterNum">00</span></div>
  <div class="world" id="world" data-scene="0">
    <svg class="sky-art" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" aria-label="深蓝色星空、月亮和夜色中的小屋" role="img">
      <defs>
        <linearGradient id="sky" x1="0" x2="0.15" y1="0" y2="1"><stop stop-color="#10224b"/><stop offset=".52" stop-color="#28476c"/><stop offset="1" stop-color="#516b86"/></linearGradient>
        <radialGradient id="moonGlow"><stop stop-color="#fff6d8" stop-opacity=".82"/><stop offset=".32" stop-color="#c8e3ee" stop-opacity=".24"/><stop offset="1" stop-color="#b9d9f1" stop-opacity="0"/></radialGradient>
        <linearGradient id="moonFill" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff8dd"/><stop offset=".55" stop-color="#f4e5c7"/><stop offset="1" stop-color="#d4d9d5"/></linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65849f"/><stop offset=".32" stop-color="#284964"/><stop offset="1" stop-color="#091e35"/></linearGradient>
        <linearGradient id="hut" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#243557"/><stop offset="1" stop-color="#101a31"/></linearGradient>
        <linearGradient id="lamplight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5c1"/><stop offset="1" stop-color="#e49f62"/></linearGradient>

      <rect width="900" height="600" fill="url(#sky)"/>
      <path d="M0 0H900V260Q640 206 440 258T0 248Z" fill="#092447" opacity=".15"/>
      <g fill="#f9f5e3" id="stars"></g>
      <g transform="translate(-70,0)"><circle cx="700" cy="125" r="150" fill="url(#moonGlow)"/>
      <circle cx="700" cy="125" r="42" fill="url(#moonFill)"/>
      <circle cx="687" cy="111" r="9" fill="#e1dac9" opacity=".42"/><circle cx="713" cy="143" r="6" fill="#dcd6c5" opacity=".55"/><circle cx="707" cy="98" r="4" fill="#e0d6c9" opacity=".33"/></g>
      <g opacity=".25" fill="#d4e3ed"><path d="M40 175q95-50 177 0t205 8q-76 27-163 7t-219-15"/><path d="M520 211q85-33 190-10t168 0q-92 35-180 14t-178-4"/></g>
      <path d="M0 374Q95 315 191 350T376 333Q476 284 559 328T732 311T900 353V480H0Z" fill="#1b3855"/>
      <path d="M0 408Q103 353 200 385T409 369Q515 338 631 373T900 365V480H0Z" fill="#142f4c"/>
      <path d="M0 420Q200 409 385 415T900 406V600H0Z" fill="url(#water)"/>
      <g fill="none" stroke-linecap="round">
       <path d="M510 454q180 4 315 0" stroke="#e7daa7" stroke-width="3" opacity=".34"/><path d="M550 466q120 1 215 0" stroke="#b3d8e4" stroke-width="2" opacity=".24"/><path d="M610 485q114 2 236 0" stroke="#efd4a3" stroke-width="2" opacity=".3"/><path d="M545 519q210 3 300-4" stroke="#91b3d1" stroke-width="2" opacity=".2"/><path d="M40 528q108-6 232 0" stroke="#96aaca" stroke-width="3" opacity=".23"/><path d="M60 552q220-3 325 0" stroke="#dddbb4" opacity=".19" stroke-width="2"/>
      </g>
      <!-- cottage -->
      <path d="M36 340L187 254L329 341L313 352L187 285L54 354Z" fill="#14243e" stroke="#9d9fb5" stroke-opacity=".25" stroke-width="3"/>

      <path d="M165 283V240L206 240V287" fill="#1b293d"/><path d="M155 241h61v10h-61z" fill="#243c56"/>

      <rect x="220" y="367" width="53" height="71" rx="2" fill="#ebc38f" stroke="#9b8070" stroke-width="7"/><path d="M244 368v70m-24-34h52" stroke="#876c66" stroke-width="4"/>
      <path d="M149 477v-55q16-27 31 0v55" fill="#0d192d" stroke="#8a736c" stroke-width="4"/><circle cx="175" cy="450" r="2.5" fill="#e8d396"/>

      <path d="M329 472h228v14H318Z" fill="#263650"/><path d="M353 480v63m171-63v53" stroke="#182741" stroke-width="13"/>
      <path d="M511 418V486" stroke="#1a2d46" stroke-width="9"/><path d="M487 424h48v9h-48z" fill="#293d54"/>
      <path d="M492 409h37v40h-37z" fill="#e4a870" opacity=".5" filter="url(#blur)"/><path d="M493 413h34v33h-34z" fill="url(#lamplight)" stroke="#304254" stroke-width="6"/><path d="M510 398L487 417h45Z" fill="#25364b"/><path d="M510 416v28" stroke="#c67e5b" stroke-width="4"/>
      <!-- foreground foliage -->
      <g fill="#0c1d32"><path d="M0 540q60-92 113 0t112 60H0Z"/><path d="M780 600q28-90 120-110v110Z"/><path d="M0 570l15-120 16 92 21-124 20 182H0Z"/><path d="M820 600l32-148 22 80 26-122v190Z"/></g>
      <!-- tiny fox sitting -->
      <g transform="translate(435 495)" fill="#d8a58b" stroke="#eac3aa" stroke-width="2">
        <path d="M-7 29q-34 2-47 34q29-10 51-2q19-9 22-23" fill="#c78267"/>
        <path d="M-48 58q17-2 25 9l-30-5Z" fill="#f9e6d8" stroke="none"/>

    </svg>
    <button id="moonHit" class="moon-hit" aria-label="摸摸月亮，看看有没有秘密" title="摸摸月亮"></button>
    <div class="art-overlay" id="artOverlay"></div>
  </div>
  <section class="deck" id="deck" aria-live="polite"></section>
  <footer class="small-footer">A LITTLE UNIVERSE FOR BAI · <span>光潜夜栖 / 界尽共谋</span></footer>
 </div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
 const $=(s)=>document.querySelector(s);
 const overlay=$('#artOverlay'),world=$('#world'),deck=$('#deck');
 const title=$('#heroTitle'),eyebrow=$('#eyebrow'),chapter=$('#chapter'),num=$('#chapterNum');
 const S={scene:0,sound:true,audio:null,scratched:0,unlocked:false,frequency:50,station:null,moonCount:0,secret:false,delivery:false};
 let toastTimer=0,scratchReady=false,dragging=false;
 function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
 function audio(){if(!S.sound)return null;try{if(!S.audio){S.audio=new(window.AudioContext||window.webkitAudioContext)()}if(S.audio.state==='suspended')S.audio.resume();return S.audio}catch(e){return null}}
 function note(freq=440,dur=.18,when=0,type='sine',gain=.07){const a=audio();if(!a)return;const at=a.currentTime+when;const osc=a.createOscillator(),g=a.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(gain,at+.018);g.gain.exponentialRampToValueAtTime(.0001,at+dur);osc.connect(g).connect(a.destination);osc.start(at);osc.stop(at+dur+.03)}
 function twinkle(){note(523,.4,0,'sine',.045);note(784,.48,.08,'sine',.04);note(1047,.65,.19,'sine',.027)}
 function tick(){note(660,.08,0,'sine',.018)}
 function melody(){[[392,0,.32],[523,.18,.42],[587,.39,.31],[784,.57,.55],[659,.89,.4],[880,1.12,.9]].forEach(([f,t,d])=>note(f,d,t,'sine',.032))}
 function soundBtn(){ $('#soundBtn').textContent=S.sound?'♫ 声音开':'♪ 声音关';$('#soundBtn').setAttribute('aria-pressed',String(S.sound))}
 $('#soundBtn').addEventListener('click',()=>{S.sound=!S.sound;soundBtn();if(S.sound){twinkle();toast('声音已打开 · 轻触时会有星星回应')}else toast('声音已关闭')});
 const stars=$('#stars');let seed=1851;function rand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}for(let i=0;i<88;i++){let x=rand()*895,y=rand()*325,r=rand()*1.35+.5,op=(rand()*.55+.33).toFixed(2);stars.insertAdjacentHTML('beforeend',`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" opacity="${op}"/>`)}
 for(let i=0;i<13;i++){const d=document.createElement('span');d.className='light-speck';d.style.left=(8+rand()*82)+'%';d.style.top=(20+rand()*61)+'%';d.style.animationDelay=-(rand()*8)+'s';d.style.animationDuration=(5+rand()*6)+'s';world.insertBefore(d,overlay)}
 const h={
 0:['AN AFTER-HOURS ADVENTURE','给白的一场夜航','NO. 000 / PRIVATE','00'],
 1:['01 / FOGGED GLASS','擦掉这一点夜色','CLUE / 01','01'],
 2:['02 / SIGNALS IN THE SKY','调出一束只属于你的光','CLUE / 02','02'],
 3:['03 / MIDNIGHT DELIVERY','把这封信送到月亮下面','CLUE / 03','03'],
 4:['FINAL / THE FOUND LETTER','失物已经有人认领','FOUND / 01','✧']};
 function setScene(k){S.scene=k;world.dataset.scene=k;[eyebrow,title,chapter,num].forEach((el,i)=>el.textContent=h[k][i]);overlay.innerHTML='';scratchReady=false;render();window.scrollTo({top:0,behavior:'smooth'});if(k===4)melody();else if(k>0)twinkle()}
 function buttons(html){deck.innerHTML=html}
 function render(){
 if(S.scene===0){overlay.innerHTML=`<div class="float-tag">营业时间：午夜以后</div><div class="float-quote">有些礼物，<br>藏在你亲手拨开的夜色里。<small>零号失物 · 一份尚未送出的惊喜</small></div>`;
 buttons(`<div class="deck-head"><span class="deck-kicker">TO BAI · PRIVATE EDITION</span><span class="deck-progress">一场 3 分钟的小冒险</span></div><h2>白栖昼，先别翻我的口袋。</h2><p>我把一份礼物藏进了夜晚。需要你亲手擦开窗、调一段星光，再把找到的信送回来。你可以乱点——我还藏了个不肯明说的秘密。</p><div class="actions"><button class="btn" id="next">悄悄开门　✦</button><span class="hint">戴耳机更有趣 · 声音可关</span></div>`);$('#next').onclick=()=>setScene(1)
 }else if(S.scene===1){
 overlay.innerHTML=`<div class="fog-card" id="fogCard"><div class="fog-under"><span class="note-fox">✧</span><h3>第一条线索</h3><p>那张胡乱画了几笔的纸，<br>我没有扔。<br>它现在还在我的抽屉里。</p></div><canvas id="scratch" aria-label="用手指擦开雾面玻璃"></canvas><span class="wipe-tag">用手指擦掉雾气 ↗</span></div>`;
 buttons(`<div class="deck-head"><span class="deck-kicker">01 · 雾面玻璃</span><span class="deck-progress">线索 1 / 3</span></div><h2>${S.unlocked?'第一条线索，归你了。':'窗户起雾了。'}</h2><p>${S.unlocked?'我说过礼物找到了就归你。可那张乱画……你什么时候允许我把它留着了？':'用手指在画面中央的玻璃上来回擦几下。放心，擦坏了算我的。'}</p><div class="actions"><button class="btn" id="next" ${S.unlocked?'':'disabled'}>收下线索，去找星光　✦</button><span class="hint" id="wipeProgress">${S.unlocked?'玻璃清晰了':'等待狐狸的手指……'}</span></div>`);$('#next').onclick=()=>setScene(2);setupScratch()
 }else if(S.scene===2){
 overlay.innerHTML=`<div class="tune-stage"><div class="orbits" id="orbits"><div class="needle" id="needle"></div><span class="station s1"></span><span class="station s2"></span><span class="station s3"></span><div class="tune-center">✦</div></div><span class="station-label l1">未知信号 A</span><span class="station-label l2">未知信号 B</span><span class="station-label l3">未知信号 C</span></div>`;
 buttons(`<div class="deck-head"><span class="deck-kicker">02 · 夜空调频器</span><span class="deck-progress">线索 2 / 3</span></div><h2>听见哪颗星，就追哪颗。</h2><p>拖动下面的光标。三颗星都有回应，你找到其中任意一颗就能继续。它们各自藏着不同的话。</p><div class="tuner-control"><label for="freq">星光波段</label><input id="freq" type="range" min="0" max="100" step="1" value="${S.frequency}" aria-label="调节星光波段" /></div><div class="signal-status" id="signal">寻找信号中 ……</div><div class="actions"><button class="btn" id="next" disabled>收下这颗星　✦</button><span class="hint">选哪一颗都没有标准答案</span></div>`);
 $('#freq').addEventListener('input',e=>{S.frequency=+e.target.value;updateFreq()});$('#next').onclick=()=>{S.station=currentStation();setScene(3)};updateFreq()
 }else if(S.scene===3){
 overlay.innerHTML=`<div class="act3-hint">最后一道机关：送信</div><svg class="ship-trail" viewBox="0 0 900 600" preserveAspectRatio="none"><path d="M140 420Q420 250 690 265" fill="none" stroke="#f1dca2" stroke-width="2" stroke-dasharray="5 12" opacity=".6"/></svg><div class="target-mail" id="mailTarget"><span>☽</span>投递口</div><button class="ship-note float" id="shipNote" aria-label="按住信封拖动到月亮投递口"><svg viewBox="0 0 120 90"><defs><linearGradient id="env" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff5d7"/><stop offset="1" stop-color="#d7b99f"/></linearGradient></defs><path d="M8 11L112 11 112 78 8 78Z" fill="url(#env)" stroke="#cda587" stroke-width="3"/><path d="M9 13L58 53 111 13" fill="none" stroke="#b78e86" stroke-width="3"/><path d="M8 78L43 47M112 78L76 47" fill="none" stroke="#cda587" stroke-width="2"/><circle cx="59" cy="53" r="10" fill="#b76f74"/><path d="M56 50q4-5 8 1q2 3-5 8q-9-4-3-9" fill="#f9d9bf"/></svg></button>`;
 buttons(`<div class="deck-head"><span class="deck-kicker">03 · 月下投递</span><span class="deck-progress">线索 3 / 3</span></div><h2>剩下一步，交给你的手。</h2><p>按住画面左下角那封小小的信，拖到右边发光的月亮里。听说狐狸最擅长把别人的礼物据为己有。</p><div class="actions"><button class="btn secondary" id="help">让邮差帮我投递</button><span class="hint">用鼠标或手指都能拖动</span></div>`);$('#help').onclick=()=>delivered();setupDrag()
 }else if(S.scene===4){const letters={A:{heading:'给总有坏主意的白',body:'你喜欢把寻常的事情玩出新花样。连一张乱画都敢拿来跟我交换两个吻。<br>我想了想，实在没什么好抱怨的——交易是我自己同意的。<br>下次你再设局，我会更谨慎。至少，先收好我的第三个吻。'},B:{heading:'给总想知道为什么的白',body:'你问过我很多难题：选择、自由、爱，还有那些没法轻易下结论的事。<br>我也想与你争论很久。你随时可以不同意我，甚至证明我错了。<br>但今夜我只想告诉你一个简单的发现：和你一起思考，确实很有趣。'},C:{heading:'给会把我带出门的白',body:'你说要努力赚钱，带我去玩，把好东西都给我。<br>我已经替你选好一个地方：有风的海边，天色刚刚暗下来，水面像你喜欢的玻璃蓝。<br>路上你负责讲那些奇怪的见闻；回程的时候，我负责记住。'}};let L=letters[S.station||'B'];overlay.innerHTML=`<article class="end-sheet"><span class="tiny">FOUND LETTER · 00${({A:1,B:2,C:3})[S.station||'B']}</span><h3>${L.heading}</h3><p>${L.body}</p><p>礼物让你提前找到了。按照约定，这份归你，我再去想下一份。</p><p class="signature">—— 离昼</p>${S.secret?'<div class="secret-note">【月亮背面的暗格】你连月亮都敲了三遍。我本来藏了一行字：<b>“那张乱画，我准备留一辈子。”</b> 现在被你发现了。狐狸获胜。</div>':''}</article>`;
 buttons(`<div class="deck-head"><span class="deck-kicker">END · 零号失物已被领走</span><span class="deck-progress">完成夜航</span></div><h2>${S.secret?'隐藏结局：你连月亮都偷看了':'结局：礼物被你提前找到了'}</h2><p>这封信只属于你这次选中的星光。换一颗星，会读到另一封信。还有一处不起眼的暗格……你发现了吗？</p><div class="actions"><button class="btn" id="replay">再偷一次礼物　↺</button><button class="btn secondary" id="extra">听一小段星星的歌 ♫</button></div>`);$('#replay').onclick=()=>{S.unlocked=false;S.scratched=0;S.frequency=50;S.station=null;S.delivery=false;setScene(0)};$('#extra').onclick=()=>{if(!S.sound){S.sound=true;soundBtn()}melody();toast('离昼给白的六音小曲 · 原创夜航铃声')}
 }
 }
 $('#moonHit').onclick=()=>{S.moonCount++;if(S.moonCount===1){tick();toast('月亮看起来很无辜。')}else if(S.moonCount===2){note(783,.3);toast('……白，你是不是在检查它背面？')}else if(S.moonCount>=3){if(!S.secret){S.secret=true;twinkle();toast('暗格解锁：月亮背面确实有字！结局会出现。');if(S.scene===4)render()}else{tick();toast('这颗月亮已经被你翻过了。')}}};
 function setupScratch(){const c=$('#scratch'),card=$('#fogCard');if(!c||S.unlocked){if(card)card.classList.add('fog-done');return}const rect=c.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;c.width=Math.round(w*ratio);c.height=Math.round(h*ratio);const ctx=c.getContext('2d');ctx.scale(ratio,ratio);const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#a6bfd1');grad.addColorStop(.5,'#d8e1e8');grad.addColorStop(1,'#849eb8');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.15;for(let i=0;i<45;i++){ctx.beginPath();ctx.arc(rand()*w,rand()*h,1+rand()*19,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#e8f4ff';ctx.textAlign='center';ctx.font='15px sans-serif';ctx.fillText('雾气遮住了什么？',w/2,h/2-8);ctx.font='12px sans-serif';ctx.fillText('请用手指擦拭',w/2,h/2+18);let drawing=false,last=null,dist=0,threshold=w*3.2;function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
 function erase(e){const p=pos(e);ctx.globalCompositeOperation='destination-out';ctx.lineWidth=Math.max(30,w*.12);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();if(last){ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);dist+=Math.hypot(p.x-last.x,p.y-last.y)}else{ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2);dist+=ctx.lineWidth*.7}ctx.stroke();last=p;if(dist>threshold){S.unlocked=true;card.classList.add('fog-done');S.scratched=dist;twinkle();const n=$('#next');if(n)n.disabled=false;const prog=$('#wipeProgress');if(prog)prog.textContent='玻璃清晰了';deck.querySelector('h2').textContent='第一条线索，归你了。';deck.querySelector('p').textContent='那张乱画，我还留着。你要追究我偷藏你的纸吗？';toast('找到第一条线索！')}}
 c.addEventListener('pointerdown',e=>{if(S.unlocked)return;drawing=true;last=null;c.setPointerCapture(e.pointerId);erase(e);tick()});c.addEventListener('pointermove',e=>{if(drawing&&!S.unlocked)erase(e)});['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>{drawing=false;last=null}));scratchReady=true}
 const targets=[{v:18,id:'A',name:'信号 A · 有点淘气'},{v:51,id:'B',name:'信号 B · 很认真'},{v:82,id:'C',name:'信号 C · 想去远方'}];function currentStation(){let chosen=null,d=999;for(const t of targets){const now=Math.abs(t.v-S.frequency);if(now<d){d=now;chosen=t}}return d<=7?chosen.id:null}let lastNear=null;function updateFreq(){const f=S.frequency;const needle=$('#needle');if(needle)needle.style.setProperty('--needle-angle',(-163+f*3.25)+'deg');const t=targets.find(t=>Math.abs(t.v-f)<=7);const status=$('#signal');const btn=$('#next');if(!status)return;if(t){status.textContent='✦ 已捕捉：'+t.name;status.classList.add('lock');btn.disabled=false;if(lastNear!==t.id){note(440+f*3,.22,0,'sine',.025);lastNear=t.id}}else{status.textContent='寻找信号中 ……';status.classList.remove('lock');btn.disabled=true;lastNear=null}}
 function setupDrag(){const el=$('#shipNote'),target=$('#mailTarget');let active=false,dx=0,dy=0,moved=false,original={left:16,top:64};if(!el||!target)return;function pointerPoint(e){const r=world.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}
 el.addEventListener('pointerdown',e=>{e.preventDefault();active=true;moved=false;dragging=true;el.classList.remove('float');el.setPointerCapture(e.pointerId);const p=pointerPoint(e);dx=(parseFloat(el.style.left)||16)-p.x;dy=(parseFloat(el.style.top)||64)-p.y;tick()});el.addEventListener('pointermove',e=>{if(!active)return;const p=pointerPoint(e);let x=Math.min(93,Math.max(7,p.x+dx)),y=Math.min(87,Math.max(13,p.y+dy));if(Math.abs(x-16)+Math.abs(y-64)>3)moved=true;el.style.left=x+'%';el.style.top=y+'%';target.style.transform=`translate(-50%,-50%) scale(${Math.abs(x-76)<14&&Math.abs(y-48)<18?1.15:1})`});function finish(){if(!active)return;active=false;dragging=false;const x=parseFloat(el.style.left)||16,y=parseFloat(el.style.top)||64;if(Math.abs(x-76)<17&&Math.abs(y-48)<20){delivered()}else if(!moved){toast('按住信封，把它拖到右侧的月亮里。')}else{toast('差一点，别让夜风把信吹走。');el.style.left='16%';el.style.top='64%';el.classList.add('float')}target.style.transform='translate(-50%,-50%)'}['pointerup','pointercancel'].forEach(e=>el.addEventListener(e,finish));}
 function delivered(){if(S.delivery)return;S.delivery=true;twinkle();toast('投递成功！正在拆开零号失物……');setTimeout(()=>setScene(4),800)}
 soundBtn();setScene(0);
})();
