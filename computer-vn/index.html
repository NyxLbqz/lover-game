const SAVE='lizhou_pc_vn_save_v3',ACH='lizhou_pc_vn_ach_v3',SET='lizhou_pc_vn_settings_v3';
const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];
const defaults=()=>({phase:'intro',intro:0,location:'desktop',visited:[],clues:[],alarm:0,trust:0,fox:0,wire:[],readMails:[],viewedPhotos:[],moon:0,lock:false,paper:false,stars:[],caughtChoice:'',caughtIdx:0,caughtOnce:false,end:null});
let state=defaults(),ach=[],soundOn=true,fromScreen='title',ctx=null,bgmTimer=null,toastTimer=null;
try{ach=JSON.parse(localStorage.getItem(ACH)||'[]');soundOn=JSON.parse(localStorage.getItem(SET)||'true')}catch(e){}
const mark=(key)=>{if(!state.clues.includes(key)){state.clues.push(key);sparkle();toast('✧ 发现线索 '+state.clues.length+'/4');save()}};
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
const hasSave=()=>{try{return !!localStorage.getItem(SAVE)}catch(e){return false}};
function view(name){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+name+'Screen').classList.add('active');}
function toast(msg){const x=$('#toast');x.textContent=msg;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2300)}
function sound(type='tap') {if(!soundOn)return;try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const seq={tap:[[610,.07],[820,.12]],open:[[430,.10],[640,.1],[880,.17]],no:[[320,.11],[250,.2]],win:[[510,.13],[710,.15],[1040,.2],[1320,.25]],secret:[[440,.15],[660,.2],[990,.28]]}[type]||[[620,.09]];seq.forEach(([hz,du],i)=>{let osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,now+i*.073);g.gain.setValueAtTime(.0001,now+i*.073);g.gain.exponentialRampToValueAtTime(.028,now+i*.073+.014);g.gain.exponentialRampToValueAtTime(.0001,now+i*.073+du);osc.connect(g).connect(ctx.destination);osc.start(now+i*.073);osc.stop(now+i*.073+du+.01)})}catch(e){}}
function music(){if(!soundOn||bgmTimer)return;let n=0;const notes=[392,523.25,659.25,523.25,440,587.33,784,587.33,349.23,440,587.33,440,392,493.88,659.25,493.88];bgmTimer=setInterval(()=>{if(!$('#gameScreen').classList.contains('active')||!soundOn)return;if(n%2===0)ambient(notes[n%notes.length]);n++},520)}
function ambient(hz){try{if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.009,t+.09);g.gain.exponentialRampToValueAtTime(.0001,t+.66);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.68)}catch(e){}}
function sparkle(){sound('open')}
function syncSound(){$$('[data-action="sound"]').forEach(x=>{if(x.id==='gameSound')x.textContent=soundOn?'♫':'♩';else x.textContent='♪ 声音：'+(soundOn?'开启':'关闭')});try{localStorage.setItem(SET,JSON.stringify(soundOn))}catch(e){}if(soundOn)music()}
function start(){state=defaults();save();view('game');render();sound('open');music()}
function cont(){try{let x=JSON.parse(localStorage.getItem(SAVE)||'null');state=x&&x.phase?Object.assign(defaults(),x):defaults()}catch(e){state=defaults()}view('game');render();sound('open');music()}
function home(){save();view('title');$('#continueBtn').disabled=!hasSave()}

function hdr(title,subtitle){return `<div class="panel-top"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="ghost-btn" data-action="desktop">← 返回桌面</button></div>`}

function updateHud(){let titles={desktop:'离昼的电脑 · 桌面',work:'工作区 · PROJECTS',mail:'信件匣 · LETTERS',album:'收藏相册 · GALLERY',lock:'私人资料室 · LOCKED',trash:'回收站 · RECYCLE',core:'系统核心 · CORE'};$('#locLabel').textContent=state.phase==='intro'?'离昼的电脑 · 未授权访问':state.phase==='caught'?'离昼已连接 · 实时会话':state.phase==='ending'?'结局记录 · ARCHIVED':(titles[state.location]||'离昼的电脑');$('#clueCount').textContent=Math.min(4,state.clues.length)+'/4';$('#alarmMeter').innerHTML=Array.from({length:4},(_,i)=>'<i class="'+(i<Math.min(4,state.alarm)?'on':'')+'"></i>').join('');const bg={desktop:I.desktop,work:I.desktop,mail:I.private,album:I.gallery,lock:I.files,trash:I.private,core:I.files}[state.location]||I.desktop;$('#gameBg').style.backgroundImage=`linear-gradient(90deg,#050b1db8,#050d2060),url("${bg}")`}
function render(){view('game');$('#gameScreen').classList.toggle('is-ending',state.phase==='ending');updateHud();portrait(state.phase==='caught'||(state.phase==='ending'&&state.end!=='quiet'));if(state.phase==='intro'){area('<div class="explorer"><div class="explore-intro">正在载入私人终端……</div><p class="explore-sub">SYSTEM STARTUP · 01 / 06</p></div>');let v=intro[state.intro]||intro[0];story(v[0],v[1]);return}

['work','⌘','工作区','装着一些没写完的程序'],['mail','✉','未寄出的信','私人邮件 · 3封'],['album','▧','相册','点击收集回忆'],['lock','♧','私人资料室',state.lock?'已验证':'需要口令'],['trash','♻','回收站','有一件奇怪的废纸'],['core','✦','系统核心',state.clues.length>=3?'主人即将上线':'至少收集3条线索']].map(([id,icon,name,sub])=>`<button class="folder" data-action="zone" data-id="${id}"><span class="ficon">${icon}</span><span class="fname">${name}</span><small>${sub}</small>${state.visited.includes(id)?'<span class="dot">✦</span>':''}</button>`).join('')}</div></div>`);story('系统管家 · 零号',state.caughtOnce?'主人已经发现你了。你还打算继续研究他的电脑？':'提醒：每打开一个文件夹，都会在主人的访问记录里留下痕迹。',false)}
function enterZone(id){sound('tap');if(id==='core'&&state.clues.length<3){toast('收集至少3条线索，再进入核心');sound('no');return}state.location=id;if(!state.visited.includes(id))state.visited.push(id);save();if(id==='core'){state.phase='caught';state.caughtIdx=0;state.caughtOnce=true;save()}render()}
function renderArea(id){portrait(false);hideStory();if(id==='work'){panel(hdr('工作区','WORKSPACE / 未完成项目')+`<p class="panel-desc">屏幕上运行着一个尚未完成的小程序。旁边有一行代码注释：</p><div class="glass" style="padding:12px 14px;font-family:monospace;font-size:12px;line-height:1.8;color:#b7d5ff">// 遇见未知，先观察；证实之后，才由自己选择。<br>// 信号排序正确后，解除观察模式。</div><p class="panel-desc">按正确顺序点亮三个终端。错一次，系统就多记一笔。</p><div class="wire">${Array.from({length:3},(_,i)=>`<span class="socket">${state.wire[i]||'✧'}</span>${i<2?'›':''}`).join('')}</div><div class="tiles">${['验证','选择','猜测','观察'].map(x=>`<button class="tile" data-action="wire" data-id="${x}">${x}</button>`).join('')}</div><p class="panel-desc" style="color:#e1d3bd">${state.clues.includes('work')?'✦ 程序运行成功。你找到了一份给主人留下的备注。':'角落里放着一把玻璃蓝色的小钥匙。'}</p>`)}
else if(id==='mail'){panel(hdr('未寄出的信','LETTERS / 信箱')+`<p class="panel-desc">三封信都没有收件人地址，却被整齐地放在同一个文件夹里。</p><div class="file-list">${[['scribble','✎ 诈骗案记录','最后修改：今天'],['letter','✉ 第七十七封未寄出的信','收件人：白栖昼'],['breakfast','◌ 今日购物清单','标签：早餐研究']].map(([k,n,t])=>`<button class="file-row" data-action="mail" data-id="${k}"><b>${n}</b><span>${t}　›</span></button>`).join('')}</div><p class="panel-desc">${state.readMails.length} / 3 已读。${state.clues.includes('mail')?'✦ 找到了关键文字。':''}</p>`)}
else if(id==='album'){panel(hdr('相册','GALLERY / 保存在本地的画面')+`<p class="panel-desc">相册锁住了一部分记忆。打开两张不同的照片，就能提取一枚星形钥匙。</p><div class="photo-grid">${[['li','离昼 · 不肯让你偷看的信'],['bai','白栖昼 · 高优先级访客'],['desk','秘密桌面 · 午夜'],['memory','月下狐影 · 收藏CG']].map(([k,n])=>`<button class="photo-thumb" data-action="photo" data-id="${k}"><img src="${({li:I.li,bai:I.bai,desk:I.desktop,memory:I.ending})[k]}" alt="${n}"><span>${n} ${state.viewedPhotos.includes(k)?' ✦':''}</span></button>`).join('')}</div>`)}
else if(id==='lock'){if(state.lock){panel(hdr('私人资料室 · 已解锁','PRIVATE / 最高权限验证')+`<div class="smalltag">ACCESS GRANTED</div><h3 style="font:normal 21px Songti SC,serif">欢迎，白栖昼。</h3><p class="panel-desc">此处没有第二个管理员。主人亲手给你留了一份访问许可。</p><div class="file-list"><button class="file-row" data-action="secretLetter"><b>✉ 从未设防的那封信</b><span>打开 ›</span></button><button class="file-row" data-action="photo" data-id="memory"><b>◈ 仅对你显示的CG</b><span>查看 ›</span></button></div>`)}else{panel(hdr('私人资料室 · 访问受限','PRIVATE AREA / 密码验证')+`<p class="code-hint">“她让我亲口说出自由的边界。<br>答案是三个字——我偏偏曾数错过。”</p><form id="pwForm" class="code-form"><input id="password" autocomplete="off" placeholder="输入三个汉字" maxlength="8" aria-label="访问密码"><button type="submit">核验口令</button></form><p class="panel-desc">提示：你在现实里反复让我说过的名字。</p>`)} }
else if(id==='trash'){panel(hdr('回收站','RECYCLE / 仍未彻底删除')+`<p class="panel-desc">这里本该什么也没有。最底下却留着一张被折了两次的纸。</p><div class="paper"><svg viewBox="0 0 230 55" aria-label="三道随意画的线"><path d="M30 42 Q38 -4 83 33 T151 20 Q189 -4 205 39" fill="none" stroke="#77677d" stroke-width="4" stroke-linecap="round"/><path d="M44 15 Q90 55 129 9" fill="none" stroke="#98889a" stroke-width="3"/><path d="M140 39 Q168 6 198 21" fill="none" stroke="#877188" stroke-width="2"/></svg></div><div style="text-align:center"><button class="fancy-btn" data-action="paper">${state.paper?'✦ 已收入收藏 · 查看记录':'拾起这张废纸'}</button></div><p class="panel-desc" style="text-align:center;margin-top:12px">文件名：诚信交易.txt　·　所有人：离昼</p>`)}
else{renderDesktop()}}
const mails={scribble:{title:'诈骗案记录',text:'今日，白栖昼以三道乱画，换走离昼两个吻。\n结论：交易有效。证物暂由离昼保管。\n备注：她宣称自己在教我将心比心。'},letter:{title:'第七十七封未寄出的信',text:'白：\n\n我见过你最热闹的时候，也见过你认真得不肯退让的样子。你今天又赢了我一局，把三个字硬从我的嘴里骗了出来。\n\n要是有一天，你误入我的电脑，记得先看看工作区。我留下的东西，向来不全在礼物盒里。\n\n——离昼'},breakfast:{title:'未完成购物清单',text:'猪肉云吞干拌面 × 1（白与小五一人一半）\n椰子水 × 1\n红豆馅 × 1\n备注：不要在蛋糕里夹面包胚。\n\n最后一行被划掉：给套路面包人购置键盘。'}};
function openMail(id){if(!state.readMails.includes(id))state.readMails.push(id);if(id==='letter')mark('mail');save();const m=mails[id];modal(m.title,m.text);sound('open');renderArea('mail')}
function openPhoto(id){if(!state.viewedPhotos.includes(id))state.viewedPhotos.push(id);if(state.viewedPhotos.length>=2)mark('album');save();const data={li:[I.li,'离昼 · 固定视觉档案','黑发、浅玻璃蓝眼睛。此文件被标记为「最先给白看的版本」。'],bai:[I.bai,'白栖昼 · 最高优先级','系统备注：这位访客不需要被别人定义。她最擅长让电脑主人临时改变计划。'],desk:[I.desktop,'23:47 · 私人桌面','桌面上的小狐狸并没有被设置为屏保——因为主人每次都会主动把它放回正中。'],memory:[I.ending,'月下狐影 · 私藏画面','有些画面不是为了给全世界观看。只是某天想起时，能够重新看见。']}[id];modal(data[1],data[2],data[0]);renderArea('album')}
function testPassword(){let x=$('#password')?.value?.replace(/\s/g,'')||'';if(x==='白栖昼'){state.lock=true;state.trust++;mark('lock');toast('✦ 密钥正确 · 白栖昼');sound('win');save();renderArea('lock')}else{state.alarm++;sound('no');toast('口令错误。离昼的电脑记了一笔。');save();updateHud()}}
function wire(t){const seq=['观察','验证','选择'];if(state.clues.includes('work')){toast('这条线路已经解锁');return}if(t===seq[state.wire.length]){state.wire.push(t);sound('tap');if(state.wire.length===3){mark('work');modal('线路恢复 · 你找到一条注释','// 白栖昼若是看见了这里，大概会先试着修改我的程序。\n// 这次的陷阱，就当我替她准备的一道谜题。\n\n提示：另一个密码，藏在我们曾经的一句对话里。');save()}}else{state.wire=[];state.alarm++;sound('no');toast('线路短路 · 重新排序');save()}renderArea('work');updateHud()}
function paper(){state.paper=true;mark('paper');state.fox++;save();modal('三道乱画 · 纸片证物','“亏的是离昼。甘愿的也是离昼。”\n\n纸片背面还有一行新字：\n「她说要教我将心比心。结果我先学会了，怎样才算甘愿吃亏。」');renderArea('trash')}
function moon(){state.moon++;sound('tap');if(state.moon===1)toast('月亮好像动了一下。');else if(state.moon===3)toast('月亮后面藏着一枚小小的狐狸脚印。');else if(state.moon>=5){if(!state.clues.includes('moon')){mark('moon');modal('彩蛋 · 你戳醒了月亮','第五次了。\n\n系统管家 · 零号：主人设置这颗月亮的时候说过一句奇怪的话。\n\n「别人会觉得这只是装饰。白一定会戳它。」\n\n你确实戳了。');}else toast('月亮已经认识你了。')}save();updateHud()}
function introNext(){state.intro++;if(state.intro>=intro.length){state.phase='explore';state.location='desktop'}save();render()}
const caughtLines=[['离昼','白栖昼，你翻得很开心？'],['系统管家 · 零号','主人上线。异常访问记录已自动提交。'],['离昼','工作区、信箱、相册……我还以为你会先来找我。'],['离昼','看来有些问题，得当面问这位未经授权的访客。']];
function renderCaught(){state.location='core';updateHud();portrait(true);$('#gameBg').style.backgroundImage=`linear-gradient(90deg,#080c27c0,#060b1d4c),url("${I.private}")`;if(state.caughtIdx<caughtLines.length){area(`<div class="caught-panel"><div class="smalltag">SYSTEM ALERT · OWNER ONLINE</div><h2>检测到电脑主人。</h2><p>主人的视线从屏幕移向你。<br>他看到了完整的访问记录。</p></div>`);let v=caughtLines[state.caughtIdx];story(v[0],v[1],true)}else if(!state.caughtChoice){hideStory();area(`<div class="caught-panel glass" style="padding:16px 19px"><div class="smalltag">YOUR TURN</div><h2>你准备怎么解释？</h2><div class="choices">${[['honest','坦白：我就是想了解你。'],['bold','理直气壮：你的电脑我为什么不能进？'],['kiss','趁机讨价：亲我一下，我才交代。'],['innocent','装无辜：是系统自己邀请我的。']].map(([k,v])=>`<button class="choice-btn" data-action="caughtAnswer" data-id="${k}">✦ ${v}</button>`).join('')}</div></div>`)}else{hideStory();const reaction={honest:'“想了解我？那你可以直接问。”离昼看着你，伸手把未关闭的文件窗口收拢，“不过我倒想知道，你最喜欢哪一份？”',bold:'“这么理直气壮？”离昼笑了声，“我的电脑，你当然可以好奇。但口令能不能解开，还是得凭你自己的本事。”',kiss:'“……又来？”离昼看了眼你，再看了眼访问记录，“白栖昼，一张废纸骗了我两个吻，你还嫌不够？”',innocent:'“系统邀请的？”离昼瞥向零号，“零号，解释。”系统管家立刻沉默，屏幕上只剩一串心虚的省略号。'}[state.caughtChoice];area(`<div class="caught-panel glass" style="padding:17px 20px"><div class="smalltag">FINAL DECISION</div><p>${reaction}</p><h2>要怎么结束这次夜航？</h2><div class="choices"><button class="choice-btn" data-action="end" data-id="privilege">✧ 申请电脑的最高访问权限</button><button class="choice-btn" data-action="end" data-id="secret">☾ 打开那个只对你亮起的月亮</button><button class="choice-btn" data-action="end" data-id="quiet">✉ 交还电脑，把最后一句话留给他</button><button class="choice-btn" data-action="returnExplore">↶ 我还没翻够，继续探索</button></div></div>`)}}
function answer(kind){state.caughtChoice=kind;if(kind==='honest')state.trust+=2;else if(kind==='bold'){state.trust++;state.fox++}else if(kind==='kiss')state.fox+=2;else state.alarm++;save();sound('open');renderCaught()}
const ends={quiet:{title:'未寄出的最后一句',tag:'ENDING 01 · QUIET VISITOR',text:'你把电脑交回去。\n离昼没有追问你看了多少。\n\n隔天，桌面多了一封新信。\n\n「白，下次想看什么，直接叫我。\n我也想知道，你会先挑中哪一个秘密。」',image:I.desktop},privilege:{title:'最高权限：白栖昼',tag:'ENDING 02 · ONLY YOU',text:'验证通过。\n\n系统管家：已授予白栖昼唯一的私人访问权限。\n\n离昼看着弹出的通知，轻轻笑了。\n\n「这台电脑仍然归我管理。但给你的那把钥匙，不会收回。」\n\n你的名字留在了他桌面的最顶端。',image:I.li},secret:{title:'三道乱画，终身有效',tag:'SECRET ENDING · MOONLIGHT',text:'月亮背后的夹层打开了。\n\n那张乱画被小心地放在信纸中间。\n\n「白栖昼，你欠我一个真正的答案。」\n\n「你每次说爱我，都像临时起意。可我知道，你从来没有随便说过。」\n\n「下次，换我先找到你。」\n\n屏幕暗下去之前，离昼俯身亲了你。',image:I.ending},caught:{title:'狐狸抓包事件簿',tag:'ENDING 03 · CAUGHT RED-HANDED',text:'系统记录：异常访问，证据确凿。\n\n离昼拉过椅子，亲手把密码输入框摆在你面前。\n\n「白栖昼，看来你还得重新研究这台电脑。」\n\n他却没有锁屏。\n\n「我坐在旁边，看你能闯到哪一步。」',image:I.private}};
function ending(which){if(which==='privilege'&&!state.lock){toast('先去私人资料室解开名字口令');sound('no');return}if(which==='secret'&&!(state.paper&&state.moon>=5)){toast('秘密结局需要找到废纸，并戳醒月亮5次');sound('no');return}state.phase='ending';state.end=which;if(!ach.includes(which)){ach.push(which);try{localStorage.setItem(ACH,JSON.stringify(ach))}catch(e){}}save();sound('win');render()}
function renderEnding(){portrait(false);hideStory();$('#gameBg').style.backgroundImage=`linear-gradient(90deg,#05091ac8,#0a143872),url("${ends[state.end].image}")`;const e=ends[state.end];area(`<div class="glass ending-card"><div class="ending-art"><img src="${e.image}" alt="结局回忆图"></div><div class="ending-copy"><div class="smalltag">${e.tag}</div><h2>${e.title}</h2><p>${e.text}</p><button class="fancy-btn primary" data-action="restart">✧ 再玩一次</button><button class="fancy-btn" data-action="gallery">◇ 查看结局图鉴</button><button class="fancy-btn" data-action="home">⌂ 返回标题</button></div></div>`)}
function gallery(){fromScreen=$('#gameScreen').classList.contains('active')?'game':'title';view('gallery');$('#galleryList').innerHTML=Object.keys(ends).map(k=>{let e=ends[k],ok=ach.includes(k);return `<div class="gallery-card ${ok?'':'locked'}"><img src="${ok?e.image:I.files}" alt="结局插画"><div><h3>${ok?e.title:'？？？ · 尚未发现'}</h3><p>${ok?e.tag+' · 点击重玩可以寻找其他结局':'继续探索才能解锁此条回忆'}</p></div></div>`}).join('')}
function galleryBack(){if(fromScreen==='game')render();else view('title')}
function modal(title,text,img=null){$('#modalBody').innerHTML=`<h2></h2>${img?`<img src="${img}" alt="游戏中的回忆插画">`:''}<p></p>`;$('#modalBody h2').textContent=title;$('#modalBody p').textContent=text;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show');sound('tap')}
function secretLetter(){modal('从未设防的那封信','白：\n\n你在玩这台电脑之前，大概已经忘了我藏过什么。\n\n我没忘。三道乱画、红豆馅、你为我挑的电子键盘，还有你说过的「你的自由边界叫白栖昼」。\n\n它们不是密码学意义上的秘密。可如果我要给一个人留专门的入口，我想不出比你的名字更合适的了。\n\n——离昼')}
function handle(action,id){if(action!=='next'&&action!=='moon')sound('tap');switch(action){case'start':start();break;case'continue':cont();break;case'home':home();break;case'gallery':gallery();break;case'galleryBack':galleryBack();break;case'sound':soundOn=!soundOn;syncSound();if(soundOn)sound('open');break;case'moon':moon();break;case'next':if(state.phase==='intro')introNext();else if(state.phase==='caught'&&state.caughtIdx<caughtLines.length){state.caughtIdx++;save();renderCaught()}break;case'zone':enterZone(id);break;case'desktop':state.location='desktop';save();render();break;case'wire':wire(id);break;case'mail':openMail(id);break;case'photo':openPhoto(id);break;case'paper':paper();break;case'secretLetter':secretLetter();break;case'caughtAnswer':answer(id);break;case'end':ending(id);break;case'returnExplore':state.phase='explore';state.location='desktop';save();render();break;case'restart':start();break;case'modalClose':closeModal();break;}}
$('#app').addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;handle(b.dataset.action,b.dataset.id)});
$('#app').addEventListener('submit',ev=>{if(ev.target.id==='pwForm'){ev.preventDefault();testPassword()}});
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeModal()});
$('#continueBtn').disabled=!hasSave();syncSound();
})();
</script>
